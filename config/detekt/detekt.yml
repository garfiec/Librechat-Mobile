build:
  maxIssues: 0

# Set to hold for almost all of the codebase; the few outliers carry a @Suppress naming the rule,
# which marks the debt instead of a threshold sized to admit the worst offender.
complexity:
  LongMethod:
    threshold: 100
    ignoreAnnotated:
      - "Composable"
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - "Composable"
  TooManyFunctions:
    thresholdInFiles: 20
    thresholdInClasses: 30
    thresholdInInterfaces: 20
    thresholdInObjects: 15
    thresholdInEnums: 10
    ignoreAnnotatedFunctions:
      - "Preview"
  NestedBlockDepth:
    threshold: 5
  CyclomaticComplexMethod:
    threshold: 25
    ignoreAnnotated:
      - "Composable"
  ComplexCondition:
    threshold: 6
  LargeClass:
    threshold: 600

style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 8
    excludeReturnFromLambda: true
    ignoreAnnotated:
      - "Composable"
  MaxLineLength:
    maxLineLength: 140
    excludeCommentStatements: true
    excludePackageStatements: true
    excludeImportStatements: true
    excludeRawStrings: true
    excludes:
      - "**/build/generated/compose/resourceGenerator/**"
  ForbiddenComment:
    active: false
  # Chrome goes through core/ui's adaptive components so it follows the interface style (Material /
  # Liquid Glass). A raw M3 bar, sheet, FAB or menu silently stays Material in glass mode, and a raw
  # dialog or sheet leaves its scrim under the native iOS glass bar.
  ForbiddenImport:
    active: true
    imports:
      - value: "androidx.compose.material3.TopAppBar"
        reason: "Use AdaptiveTopBar (core/ui components/topbar)."
      - value: "androidx.compose.material3.CenterAlignedTopAppBar"
        reason: "Use AdaptiveTopBar with a BarTitleAlignment.CENTER title."
      - value: "androidx.compose.material3.ModalBottomSheet"
        reason: "Use AdaptiveModalBottomSheet (core/ui components)."
      - value: "androidx.compose.material3.FloatingActionButton"
        reason: "Use AdaptiveFloatingActionButton (core/ui components)."
      - value: "androidx.compose.material3.SmallFloatingActionButton"
        reason: "Use AdaptiveFloatingActionButton(small = true) (core/ui components)."
      - value: "androidx.compose.material3.LargeFloatingActionButton"
        reason: "No glass counterpart yet; add one to AdaptiveFloatingActionButton."
      - value: "androidx.compose.material3.ExtendedFloatingActionButton"
        reason: "No glass counterpart yet; add one to AdaptiveFloatingActionButton."
      - value: "androidx.compose.material3.AlertDialog"
        reason: "Use AdaptiveAlertDialog (core/ui components)."
      - value: "androidx.compose.ui.window.Dialog"
        reason: "Use AdaptiveDialog (core/ui components)."
      - value: "androidx.compose.material3.DropdownMenu"
        reason: "Use AdaptiveDropdownMenu (core/ui components)."
      - value: "androidx.compose.material3.Switch"
        reason: "Use AdaptiveSwitch (core/ui components)."
      - value: "androidx.compose.material3.RadioButton"
        reason: "Use AdaptiveRadioButton (core/ui components)."
      - value: "androidx.compose.material3.Checkbox"
        reason: "Use AdaptiveCheckbox (core/ui components)."
      - value: "androidx.compose.material3.HorizontalDivider"
        reason: "Use AdaptiveDivider (core/ui components)."
      - value: "androidx.compose.material3.Button"
        reason: "Use AdaptiveButton (core/ui components)."
      - value: "androidx.compose.material3.OutlinedButton"
        reason: "Use AdaptiveOutlinedButton (core/ui components)."
      - value: "androidx.compose.material3.FilledTonalButton"
        reason: "Use AdaptiveFilledTonalButton (core/ui components)."
      - value: "androidx.compose.material3.OutlinedTextField"
        reason: "Use AdaptiveOutlinedTextField (core/ui components)."
      - value: "androidx.compose.material3.SingleChoiceSegmentedButtonRow"
        reason: "Use AdaptiveSegmentedChoice (core/ui components)."
      - value: "androidx.compose.material3.SegmentedButton"
        reason: "Use AdaptiveSegmentedChoice (core/ui components)."
      - value: "androidx.compose.material3.TabRow"
        reason: "Use AdaptiveTabRow (core/ui components)."
      - value: "androidx.compose.material3.PrimaryTabRow"
        reason: "Use AdaptiveTabRow (core/ui components)."
      - value: "androidx.compose.material3.SecondaryTabRow"
        reason: "Use AdaptiveTabRow with AdaptiveTabRowKind.SECONDARY (core/ui components)."
      - value: "androidx.compose.material3.FilterChip"
        reason: "Use AdaptiveFilterChip (core/ui components)."
      - value: "androidx.compose.material3.AssistChip"
        reason: "Use AdaptiveAssistChip (core/ui components)."
      - value: "androidx.compose.material3.InputChip"
        reason: "Use AdaptiveInputChip (core/ui components)."
      - value: "androidx.compose.material3.SuggestionChip"
        reason: "Use AdaptiveSuggestionChip (core/ui components)."
      - value: "androidx.compose.material3.SnackbarHost"
        reason: "Use AdaptiveSnackbarHost (core/ui components)."
      - value: "androidx.compose.material3.CircularProgressIndicator"
        reason: "Use AdaptiveCircularProgressIndicator (core/ui components)."
    # Tests may drive the raw M3 control on purpose: the ban governs shipped chrome.
    excludes:
      - "**/core/ui/src/commonMain/kotlin/com/garfiec/librechat/core/ui/components/topbar/**"
      - "**/core/ui/src/commonMain/kotlin/com/garfiec/librechat/core/ui/components/Adaptive*.kt"
      - "**/src/*Test/**"
      - "**/src/test/**"
  UnusedPrivateMember:
    active: true
    allowedNames: "(_|ignored|expected|serialVersionUID)"
    ignoreAnnotated:
      - "Preview"
  UnusedPrivateProperty:
    active: true
    allowedNames: "(_|ignored|expected|serialVersionUID)"
  WildcardImport:
    active: true
    excludeImports:
      - "kotlinx.coroutines.flow.*"
      - "*.resources.*"
  LoopWithTooManyJumpStatements:
    maxJumpCount: 3
  ThrowsCount:
    max: 4
  UseCheckOrError:
    active: false
  UseRequire:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated:
      - "Composable"
    # Detekt's `excludes:` REPLACES (does not merge with) the default value, so
    # the default test-source exemptions must be repeated here alongside the
    # generated-resources exclude.
    excludes:
      - "**/test/**"
      - "**/androidTest/**"
      - "**/commonTest/**"
      - "**/jvmTest/**"
      - "**/androidUnitTest/**"
      - "**/androidInstrumentedTest/**"
      - "**/jsTest/**"
      - "**/iosTest/**"
      - "**/build/generated/compose/resourceGenerator/**"
  TopLevelPropertyNaming:
    constantPattern: "[A-Z][A-Za-z0-9_]*"
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: true
    exceptionNames:
      - "RuntimeException"
      - "Throwable"
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  SwallowedException:
    ignoredExceptionTypes:
      - "InterruptedException"
      - "MalformedURLException"
      - "NumberFormatException"
      - "ParseException"
    allowedExceptionNameRegex: "_|(ignore|expected).*"
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - "Error"
      - "RuntimeException"
      - "Throwable"

coroutines:
  active: true

# Allowlist for tree-scoped infrastructure CompositionLocals (chat-session render
# caches and DataStore-projected user prefs). These match the rule's intended
# legit-use criteria (tree-scoped, cross-cutting, default or error-on-missing);
# the screen-specific-ViewModel anti-pattern the rule actually targets is absent
# from this project.
Compose:
  # The adaptive sheet and dialogs wrap M3 surfaces that open their own window and emit nothing into
  # the caller's layout; without this the rules treat every sheet or dialog host as a content emitter.
  ModifierMissing:
    active: true
    contentEmittersDenylist: AdaptiveModalBottomSheet,AdaptiveAlertDialog,AdaptiveDialog
  LambdaParameterEventTrailing:
    active: true
    contentEmittersDenylist: AdaptiveModalBottomSheet,AdaptiveAlertDialog,AdaptiveDialog
  MultipleEmitters:
    active: true
    contentEmittersDenylist: AdaptiveModalBottomSheet,AdaptiveAlertDialog,AdaptiveDialog
  CompositionLocalAllowlist:
    active: true
    allowedCompositionLocals: LocalAddArtifactToHomeScreen,LocalAttachmentDownloader,LocalDarkTheme,LocalGlassBackdrop,LocalGlassLevel,LocalGlassSheetHost,LocalGroupPosition,LocalInSeparateWindow,LocalMediaThumbnails,LocalNativeOverlayGate,LocalChatMediaViewer,LocalFeedbackEnabled,LocalImmediateMarkdown,LocalInlineArtifactPrefs,LocalIosAppLocale,LocalMermaidRenderCache,LocalOpenArtifact,LocalOpenPdf,LocalParsedMarkdownCache,LocalRelativeTimeReference,LocalSearchFocusNonce,LocalSiteIcons,LocalSubagentProgress,LocalSubagentThreads,LocalSubagentThreadsAvailable,LocalSuppressGroupAutoCollapse

# detekt-koin rule overrides (defaults ship in plugin jar; buildUponDefaultConfig = true)
koin-rules:
  # Scope "test hygiene" rule to test sources only; the rule's heuristic
  # ("any class calling startKoin without stopKoin") incorrectly flags
  # production Application classes otherwise.
  MissingKoinStopInTest:
    active: true
    excludes:
      - "**/src/main/**"
      - "**/src/commonMain/**"
      - "**/src/androidMain/**"
      - "**/src/iosMain/**"
  # Project convention is top-level `val xModule = module { }`; rule is a
  # stylistic preference (defer factory-lambda alloc), not a correctness issue.
  ModuleAsTopLevelVal:
    active: false
  # Path-exclude DataModule.kt only: it intentionally registers multiple
  # SessionTask implementations bound to SessionTask::class for getAll<SessionTask>()
  # multi-binding. Rule still active elsewhere to catch accidental same-type binds.
  DuplicateBindingWithoutQualifier:
    active: true
    excludes:
      - "**/core/data/**/DataModule.kt"

formatting:
  Indentation:
    active: false
  MaximumLineLength:
    active: false
  NoWildcardImports:
    active: false
  TrailingCommaOnCallSite:
    active: false
  TrailingCommaOnDeclarationSite:
    active: false
  Wrapping:
    active: false
  ArgumentListWrapping:
    active: false
  ParameterListWrapping:
    active: false
  FunctionSignature:
    active: false
  ImportOrdering:
    excludes:
      - "**/build/generated/compose/resourceGenerator/**"
  SpacingAroundParens:
    excludes:
      - "**/build/generated/compose/resourceGenerator/**"

# Custom row-tenancy ruleset (:detekt-rules). Enforces that account-scoped Room DAOs filter every
# tenant-table statement by accountId. See AccountScopedDaoRule.
librechat:
  AccountScopedDao:
    active: true
