<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Switch — preview</title></head>
<body>
<div id="root" class="tc-stack"></div>
<script>
var T = window.Tchat, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(T.Switch, {label:'Send with Enter', description:'Shift+Enter adds a new line.', defaultChecked:true}),
  h(T.Switch, {label:'Temporary chat'}),
  h(T.Switch, {label:'Use wallpaper colours', description:'Android 12 and later', disabled:true})
));
</script>
</body>
</html>
