<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>TextField — preview</title></head>
<body>
<div id="root" class="tc-stack"></div>
<script>
var T = window.Tchat, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
  h(T.TextField, {label:'Email', placeholder:'name@example.com', type:'email', helper:'We never show your email to other users.'}),
  h(T.TextField, {label:'Password', type:'password', defaultValue:'hunter', error:'Use at least 8 characters.'}),
  h(T.TextField, {label:'Search', icon:'search', placeholder:'Search conversations'})
));
</script>
</body>
</html>
