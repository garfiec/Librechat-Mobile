<!-- TCHAT: intermediate source for TchatLogo.png. Same T+dot glyph as
     Tchat/deploy/tchat/branding/tchat-mark.svg, with the rounded-square tile dropped and the
     glyph itself recoloured from the tile's dark foreground (#0c0f1a) to the tile's own
     gradient (#4f8cff -> #8b5cf6) — on a dark launcher background (ic_launcher_background.xml
     is #0C0F1A, matching TensorGrid's ground), a dark-on-transparent glyph would be invisible.
     Rasterize with: rsvg-convert -w 1606 -h 1606 design/TchatLogo.svg -o design/TchatLogo.png -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Tchat">
  <defs>
    <linearGradient id="tchat-glyph" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <path d="M30 34h36M48 34v30" stroke="url(#tchat-glyph)" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="48" cy="72" r="4.5" fill="url(#tchat-glyph)"/>
</svg>
