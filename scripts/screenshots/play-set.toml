# The Google Play listing images, in listing order: `scripts/screenshots/play.py set <out-dir>`.
#
# Each is a store screenshot from fastlane/ on a branded canvas under a caption. Captions are
# marketing copy for people who've never seen the app: the benefit, not the feature's name.
# Play shows them small, so keep the title to one short line and the subtitle under ten words.

images = "fastlane/metadata/android/en-US/images"

# The feature graphic in use, copied as it is. `play.py feature` draws the wordmark alternative
# kept at design/feature-graphic-wordmark.png; drop this line to use that instead.
feature_graphic = "featureGraphic.png"

